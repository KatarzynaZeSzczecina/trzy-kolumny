<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trzy Kolumny - Nauka HTML/CSS</title>
    <style>
        /* Reset podstawowych marginesów */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Kontener dla kolumn - używamy Flexbox */
        .kontener-kolumn {
            display: flex;
            width: 100%;
            min-height: 100vh; /* Wysokość na cały ekran */
        }

        /* Wspólne style dla wszystkich kolumn */
        .kolumna {
            padding: 20px;
            font-family: sans-serif;
        }

        /* Definicje szerokości i wyrównania tekstów */
        .lewa {
            width: 25%;
            background-color: #f0f0f0; /* Kolor tła, abyś widział granice */
            text-align: left;          /* Przyklejony do lewej */
        }

        .srodkowa {
            width: 50%;
            background-color: #e0e0e0;
            text-align: left;          /* Przyklejony do lewej */
        }

        .prawa {
            width: 25%;
            background-color: #d0d0d0;
            text-align: right;         /* Przyklejony do prawej */
        }
    </style>
</head>
<body>

    <div class="kontener-kolumn">
        <!-- Kolumna Lewa -->
        <div id="lewa-id" class="kolumna lewa">Ładowanie...</div>

        <!-- Kolumna Środkowa -->
        <div id="srodkowa-id" class="kolumna srodkowa">Ładowanie...</div>

        <!-- Kolumna Prawa -->
        <div id="prawa-id" class="kolumna prawa">Ładowanie...</div>
    </div>

    <!-- Prosty JavaScript, który tymczasowo (zanim wdrożysz PHP) 
         pobierze zawartość plików i wklei ją do odpowiednich kolumn -->
    <script>
        function wczytajKolumne(idElementu, nazwaPliku) {
            fetch(nazwaPliku)
                .then(response => response.text())
                .then(data => {
                    document.getElementById(idElementu).innerHTML = data;
                })
                .catch(error => {
                    document.getElementById(idElementu).innerHTML = "Błąd ładowania pliku.";
                });
        }

        // Wywołanie funkcji dla każdej kolumny
        wczytajKolumne('lewa-id', 'kolumna_lewa.html');
        wczytajKolumne('srodkowa-id', 'kolumna_srodkowa.html');
        wczytajKolumne('prawa-id', 'kolumna_prawa.html');
    </script>

</body>
</html>
